name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    name: Check / Build / Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      - name: Assert moonc >= 0.10.16
        run: |
          ver=$(moonc -v | head -n1 | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "moonc version: $ver"
          required=0.10.16
          if [ "$(printf '%s\n%s\n' "$required" "$ver" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::moonc $ver is older than required $required"
            exit 1
          fi

      - name: Check (type/syntax)
        run: moon check --deny-warn

      - name: Build
        run: moon build

      - name: Test
        run: moon test

      - name: Conformance self-check
        run: moon run cmd/verify
